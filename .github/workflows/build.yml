name: Сборка и публикация лендинга

# WHY: редактор пишет только content/*.json. Всё остальное — страницы, фрагмент
# для екома, копия текстов рядом с сайтом — собирается здесь, чтобы человеку
# не нужно было ничего пересобирать руками.
on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'src/**'
      - 'assets/**'
      - 'build.py'
      - 'editor.py'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Проверить локали
        run: python3 build.py check

      - name: Собрать
        run: python3 build.py build --base https://kolossdesign.github.io/Ketology/

      # WHY: пакет для разработчиков собирается тем же кодом, что и сайт, и кладётся
      # рядом с ним. Тогда ссылка на архив всегда ведёт на актуальную версию, а не
      # на то, что кто-то однажды выгрузил руками.
      - name: Собрать пакет для интеграции
        run: python3 build.py handover --base https://cdn.siberianhealth.com/ketology/

      - name: Сложить сайт
        run: |
          rm -rf _site && mkdir -p _site
          cp -r dist/* _site/
          cp -r assets _site/assets
          mkdir -p _site/handover
          cd handover && zip -qr ../_site/handover/ketology-integration.zip . && cd ..
          cp handover/ИНСТРУКЦИЯ.md _site/handover/instruction.md
          cp handover/ketology-*.html _site/handover/
          touch _site/.nojekyll

      # WHY: включить Pages впервые workflow не может — GitHub запрещает это
      # токену Actions. Пока владелец не переключит Settings → Pages → Source:
      # GitHub Actions, шаги публикации пропускаются, а сборка остаётся зелёной:
      # свежий dist в любом случае лежит в репозитории.
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: _site

      - name: Подсказка, если Pages не включён
        if: steps.pages.outcome != 'success'
        run: |
          echo "::warning::Pages не включён. Settings → Pages → Source: GitHub Actions —"
          echo "::warning::после этого сайт будет публиковаться автоматически."

  deploy:
    needs: build
    if: needs.build.outputs.pages == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
