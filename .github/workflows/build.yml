name: Публикация снята

# WHY: заказчик попросил убрать проект с прода. Сайт Pages нельзя выключить
# токеном Actions, поэтому публикуем ПУСТУЮ выкладку — все прежние адреса
# начинают отдавать 404. Исходники и история остаются в репозитории.
# Чтобы выключить Pages совсем: Settings → Pages → Source: None.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Пустой сайт
        run: |
          rm -rf _site && mkdir -p _site
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
